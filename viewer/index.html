<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cron Digest Archive</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --fg: #333;
            --card-bg: #ffffff;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.08);
            --card-shadow-hover: 0 4px 16px rgba(0,0,0,0.12);
            --header-bg: #1a1a2e;
            --header-fg: #ffffff;
            --accent: #1565c0;
            --accent-fg: #ffffff;
            --chip-bg: #e8eaf6;
            --chip-fg: #3f51b5;
            --chip-border: #c5cae9;
            --input-border: #ddd;
            --input-focus: #1a1a2e;
            --meta-fg: #666;
            --preview-fg: #555;
            --modal-overlay: rgba(0,0,0,0.6);
            --modal-bg: #ffffff;
            --toc-bg: #f8f9fa;
            --hr: #eee;
            --kbd-bg: #f0f0f0;
            --kbd-fg: #333;
        }

        [data-theme="dark"] {
            --bg: #121212;
            --fg: #e0e0e0;
            --card-bg: #1e1e1e;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.3);
            --card-shadow-hover: 0 4px 16px rgba(0,0,0,0.4);
            --header-bg: #0d0d1a;
            --header-fg: #e0e0e0;
            --accent: #64b5f6;
            --accent-fg: #121212;
            --chip-bg: #283593;
            --chip-fg: #c5cae9;
            --chip-border: #3949ab;
            --input-border: #444;
            --input-focus: #64b5f6;
            --meta-fg: #aaa;
            --preview-fg: #ccc;
            --modal-overlay: rgba(0,0,0,0.8);
            --modal-bg: #1e1e1e;
            --toc-bg: #2a2a2a;
            --hr: #333;
            --kbd-bg: #333;
            --kbd-fg: #e0e0e0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: var(--header-bg);
            color: var(--header-fg);
            padding: 30px 20px;
            margin-bottom: 30px;
            position: relative;
        }
        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        header p {
            opacity: 0.8;
        }
        .header-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .icon-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--header-fg);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .icon-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--input-border);
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s;
            background: var(--card-bg);
            color: var(--fg);
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--input-focus);
        }
        .filter-buttons {
            display: flex;
            gap: 10px;
        }
        .filter-btn {
            padding: 12px 20px;
            border: 2px solid var(--input-border);
            background: var(--card-bg);
            color: var(--fg);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .filter-btn.active {
            background: var(--header-bg);
            color: var(--header-fg);
            border-color: var(--header-bg);
        }
        .filter-btn:hover:not(.active) {
            border-color: var(--accent);
        }

        .tag-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            align-items: center;
            min-height: 32px;
        }
        .tag-bar-label {
            font-size: 13px;
            color: var(--meta-fg);
            font-weight: 500;
        }
        .tag-chip {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 500;
            background: var(--chip-bg);
            color: var(--chip-fg);
            border: 1px solid var(--chip-border);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            user-select: none;
        }
        .tag-chip:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .tag-chip.active {
            background: var(--accent);
            color: var(--accent-fg);
            border-color: var(--accent);
        }
        .tag-chip .count {
            font-size: 9px;
            opacity: 0.7;
            background: rgba(0,0,0,0.08);
            padding: 1px 4px;
            border-radius: 6px;
        }
        .tag-chip.active .count {
            background: rgba(255,255,255,0.2);
        }
        .tag-clear {
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
            text-decoration: underline;
            margin-left: 4px;
        }

        .digest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .digest-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s, box-shadow 0.2s, outline 0.1s;
            cursor: pointer;
            outline: 2px solid transparent;
        }
        .digest-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--card-shadow-hover);
        }
        .digest-card.focused {
            outline: 2px solid var(--accent);
        }
        .digest-card.hidden {
            display: none;
        }
        .new-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }
        .card-header {
            position: relative;
        }
        .category-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }
        .chip {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            background: var(--chip-bg);
            color: var(--chip-fg);
            border: 1px solid var(--chip-border);
        }
        .chip.hep-th { background: #e3f2fd; color: #1565c0; border-color: #90caf9; }
        .chip.gr-qc { background: #f3e5f5; color: #7b1fa2; border-color: #ce93d8; }
        .chip.quant-ph { background: #e8f5e9; color: #2e7d32; border-color: #a5d6a7; }
        .chip.cond-mat { background: #fff3e0; color: #ef6c00; border-color: #ffcc80; }
        .chip.cs { background: #fce4ec; color: #c2185b; border-color: #f48fb1; }
        .chip.math { background: #e0f2f1; color: #00695c; border-color: #80cbc4; }
        [data-theme="dark"] .chip.hep-th { background: #0d47a1; color: #bbdefb; border-color: #1565c0; }
        [data-theme="dark"] .chip.gr-qc { background: #4a148c; color: #e1bee7; border-color: #7b1fa2; }
        [data-theme="dark"] .chip.quant-ph { background: #1b5e20; color: #c8e6c9; border-color: #2e7d32; }
        [data-theme="dark"] .chip.cond-mat { background: #e65100; color: #ffe0b2; border-color: #ef6c00; }
        [data-theme="dark"] .chip.cs { background: #880e4f; color: #f8bbd0; border-color: #c2185b; }
        [data-theme="dark"] .chip.math { background: #004d40; color: #b2dfdb; border-color: #00695c; }

        .digest-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .type-arxiv {
            background: #e3f2fd;
            color: #1565c0;
        }
        .type-web {
            background: #f3e5f5;
            color: #7b1fa2;
        }
        [data-theme="dark"] .type-arxiv { background: #0d47a1; color: #bbdefb; }
        .type-moltbook {
            background: #fff8e1;
            color: #f57f17;
        }
        [data-theme="dark"] .type-moltbook { background: #f57f17; color: #fff8e1; }

        .digest-date {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--fg);
        }
        .digest-meta {
            font-size: 14px;
            color: var(--meta-fg);
            margin-bottom: 15px;
        }
        .digest-preview {
            font-size: 14px;
            color: var(--preview-fg);
            line-height: 1.5;
        }
        .digest-preview h3 {
            font-size: 14px;
            margin: 4px 0;
            color: var(--fg);
        }
        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 12px;
        }
        .card-tag {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 8px;
            background: var(--chip-bg);
            color: var(--chip-fg);
            border: 1px solid var(--chip-border);
            cursor: pointer;
            transition: background 0.15s;
            user-select: none;
        }
        .card-tag:hover {
            background: var(--accent);
            color: var(--accent-fg);
            border-color: var(--accent);
        }
        .item-count {
            display: inline-block;
            background: var(--kbd-bg);
            color: var(--kbd-fg);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 10px;
        }
        .loading {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: var(--meta-fg);
        }
        .error {
            text-align: center;
            padding: 40px;
            background: #ffebee;
            border-radius: 12px;
            color: #c62828;
        }
        .no-results {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: var(--meta-fg);
        }
        .kbd-hint {
            text-align: center;
            font-size: 12px;
            color: var(--meta-fg);
            margin-top: 10px;
            margin-bottom: 20px;
        }
        kbd {
            display: inline-block;
            background: var(--kbd-bg);
            color: var(--kbd-fg);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: ui-monospace, monospace;
            font-size: 11px;
            border: 1px solid var(--chip-border);
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: var(--modal-bg);
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 40px;
            position: relative;
            color: var(--fg);
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 28px;
            cursor: pointer;
            color: var(--meta-fg);
            line-height: 1;
        }
        .modal-close:hover {
            color: var(--fg);
        }
        .modal-content h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            padding-right: 40px;
            color: var(--fg);
        }
        .modal-content h2 {
            font-size: 1.3rem;
            margin: 25px 0 10px;
            color: var(--fg);
        }
        .modal-content h3 {
            font-size: 1.1rem;
            margin: 20px 0 8px;
            color: var(--fg);
        }
        .modal-toc {
            background: var(--toc-bg);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .modal-toc h3 {
            font-size: 1rem;
            margin: 0 0 10px 0;
            color: var(--fg);
        }
        .modal-toc ul {
            margin: 0;
            padding-left: 18px;
        }
        .modal-toc li {
            margin: 4px 0;
            cursor: pointer;
            color: var(--accent);
        }
        .modal-toc li:hover {
            text-decoration: underline;
        }
        .paper-item {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--hr);
        }
        .paper-item:last-child {
            border-bottom: none;
        }
        .paper-item h2 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.15rem;
        }
        .paper-item h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }
        .paper-item ul {
            margin: 6px 0;
            padding-left: 18px;
        }
        .paper-item li {
            margin: 2px 0;
            line-height: 1.4;
        }
        .paper-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin: 6px 0 10px;
        }
        .paper-actions {
            display: flex;
            gap: 10px;
            margin: 8px 0 12px;
        }
        .paper-actions a {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .paper-actions a:hover {
            opacity: 0.85;
        }
        .btn-abs {
            background: #e3f2fd;
            color: #1565c0;
        }
        .btn-pdf {
            background: #ffebee;
            color: #c62828;
        }
        [data-theme="dark"] .btn-abs { background: #0d47a1; color: #bbdefb; }
        [data-theme="dark"] .btn-pdf { background: #b71c1c; color: #ffcdd2; }

        .modal-content a {
            color: var(--accent);
            text-decoration: none;
        }
        .modal-content a:hover {
            text-decoration: underline;
        }
        .modal-content ul {
            margin: 10px 0;
            padding-left: 25px;
        }
        .modal-content li {
            margin: 6px 0;
        }
        .modal-content hr {
            border: none;
            border-top: 1px solid var(--hr);
            margin: 20px 0;
        }
        @media (max-width: 600px) {
            .digest-grid {
                grid-template-columns: 1fr;
            }
            .controls {
                flex-direction: column;
            }
            .modal-content {
                padding: 25px;
            }
            .header-actions {
                position: static;
                margin-top: 15px;
                justify-content: flex-end;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YrEzHgEbXgPpP+r2mlYJ8W/LYTnY4Rv0mU+0A" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqt+117bE3lgC6U7UvV6N5hD7Y/G+1YrPtmwLF/9jHjTXO33++" crossorigin="anonymous"></script>

<body>
    <header>
        <div class="container" style="position:relative;">
            <h1>🔬 Cron Digest Archive</h1>
            <p>Daily arXiv, Web Science, and Moltbook research digests — searchable, browsable, chronological</p>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" title="Toggle dark mode">🌙</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search papers, topics, authors, tags..." autocomplete="off">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="arxiv">arXiv</button>
                <button class="filter-btn" data-filter="web-science">Web Science</button>
                <button class="filter-btn" data-filter="moltbook">Moltbook</button>
            </div>
        </div>

        <div class="tag-bar" id="tagBar"></div>

        <div id="digestContainer">
            <div class="loading">Loading digests...</div>
        </div>

        <div class="kbd-hint">
            Navigate with <kbd>j</kbd> <kbd>k</kbd> · Open with <kbd>Enter</kbd> · Close with <kbd>Esc</kbd>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const SOURCES = {
            arxiv: './arxiv/',
            'web-science': './web-science/',
            moltbook: './moltbook/'
        };

        let allDigests = [];
        let currentFilter = 'all';
        let activeTag = null;
        let focusedCardIndex = -1;
        let visibleCards = [];

        /* ---------- Theme ---------- */
        function initTheme() {
            const saved = localStorage.getItem('digest-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = saved || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('digest-theme', next);
            updateThemeIcon(next);
        }
        function updateThemeIcon(theme) {
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        /* ---------- Data ---------- */
        async function fetchDigests() {
            const container = document.getElementById('digestContainer');

            try {
                const idxResponse = await fetch('index.json');
                if (idxResponse.ok) {
                    const index = await idxResponse.json();
                    allDigests = index.digests.map(d => ({
                        type: d.type,
                        date: d.date,
                        path: `${SOURCES[d.type]}${d.date}.md`,
                        content: null,
                        meta: {
                            itemCount: d.items_found,
                            categories: d.type === 'arxiv' ? d.categories : null,
                            sites: d.type === 'web-science' ? d.categories : null,
                            items: d.entries.slice(0, 3).map(e => e.title)
                        },
                        entries: d.entries,
                        allTags: [...new Set(d.entries.flatMap(e => e.tags || []))]
                    }));
                    renderDigests();
                    renderTagBar(index.stats.tag_counts || {});
                    console.log(`Loaded ${allDigests.length} digests from index.json`);
                    return;
                }
            } catch (e) {
                console.warn('index.json not available, falling back to manifest fetching');
            }

            // Fallback to manifest fetching
            const digests = [];
            for (const [type, path] of Object.entries(SOURCES)) {
                try {
                    const response = await fetch(`${path}manifest.json`);
                    if (response.ok) {
                        const manifest = await response.json();
                        const files = Array.isArray(manifest) ? manifest : (manifest.files || []);
                        for (const file of files) {
                            if (file.endsWith('.md') && file !== 'README.md') {
                                const filePath = `${path}${file}`;
                                const contentResponse = await fetch(filePath);
                                if (contentResponse.ok) {
                                    const content = await contentResponse.text();
                                    const meta = parseDigestMeta(content, type);
                                    digests.push({ type, date: file.replace('.md', ''), path: filePath, content, meta });
                                }
                            }
                        }
                    }
                } catch (e) {
                    console.warn(`Could not fetch ${type} manifest:`, e);
                }
            }
            allDigests = digests.sort((a, b) => b.date.localeCompare(a.date));
            renderDigests();
        }

        function parseDigestMeta(content, type) {
            const meta = { items: [] };
            const itemsMatch = content.match(/\*\*Items found:\*\*\s*(\d+)/);
            if (itemsMatch) meta.itemCount = parseInt(itemsMatch[1]);
            if (type === 'arxiv') {
                const catMatch = content.match(/\*\*Categories:\*\*\s*([^\n]+)/);
                if (catMatch) meta.categories = catMatch[1].trim();
            } else if (type === 'moltbook') {
                const submoltsMatch = content.match(/\*\*Submolts:\*\*\s*([^\n]+)/);
                if (submoltsMatch) meta.categories = submoltsMatch[1].trim();
            } else {
                const sitesMatch = content.match(/\*\*Sites:\*\*\s*([^\n]+)/);
                if (sitesMatch) meta.sites = sitesMatch[1].trim();
            }
            const titles = content.match(/^## \d+\.\s*(.+)/gm);
            if (titles) meta.items = titles.slice(0, 3).map(t => t.replace(/^## \d+\.\s*/, ''));
            return meta;
        }

        /* ---------- Tag Bar ---------- */
        function renderTagBar(tagCounts) {
            const bar = document.getElementById('tagBar');
            const tags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 20);
            if (tags.length === 0) {
                bar.innerHTML = '';
                return;
            }
            bar.innerHTML = '<span class="tag-bar-label">Filter by tag:</span> ' +
                tags.map(([tag, count]) => `
                    <span class="tag-chip ${activeTag === tag ? 'active' : ''}" data-tag="${tag}">
                        ${tag} <span class="count">${count}</span>
                    </span>
                `).join('') +
                (activeTag ? '<span class="tag-clear" id="tagClear">Clear filter</span>' : '');

            bar.querySelectorAll('.tag-chip').forEach(el => {
                el.addEventListener('click', () => {
                    const tag = el.dataset.tag;
                    activeTag = activeTag === tag ? null : tag;
                    renderTagBar(tagCounts);
                    renderDigests();
                });
            });
            const clearBtn = document.getElementById('tagClear');
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    activeTag = null;
                    renderTagBar(tagCounts);
                    renderDigests();
                });
            }
        }

        /* ---------- Rendering ---------- */
        function renderDigests() {
            const container = document.getElementById('digestContainer');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const latestDate = allDigests.length > 0 ? allDigests[0].date : null;

            const filtered = allDigests.filter(d => {
                if (currentFilter !== 'all' && d.type !== currentFilter) return false;
                if (activeTag) {
                    const hasTag = d.entries?.some(e => (e.tags || []).includes(activeTag))
                        || d.allTags?.includes(activeTag);
                    if (!hasTag) return false;
                }
                if (!searchTerm) return true;

                if (d.content && d.content.toLowerCase().includes(searchTerm)) return true;
                if (d.entries) {
                    return d.entries.some(e =>
                        (e.title && e.title.toLowerCase().includes(searchTerm)) ||
                        (e.authors && e.authors.toLowerCase().includes(searchTerm)) ||
                        (e.summary && e.summary.toLowerCase().includes(searchTerm)) ||
                        (e.tags && e.tags.some(t => t.toLowerCase().includes(searchTerm)))
                    );
                }
                return d.date.includes(searchTerm) ||
                    (d.meta?.items && d.meta.items.some(item => item.toLowerCase().includes(searchTerm)));
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results">No digests found. Try adjusting your search, filter, or tag.</div>';
                visibleCards = [];
                focusedCardIndex = -1;
                return;
            }

            container.innerHTML = '<div class="digest-grid">' +
                filtered.map((d, idx) => {
                    const isNew = d.date === latestDate;
                    const tags = d.allTags?.slice(0, 6) || [];
                    return `
                    <div class="digest-card" data-type="${d.type}" data-date="${d.date}" data-index="${idx}">
                        <div class="card-header">
                            <span class="digest-type type-${d.type === 'arxiv' ? 'arxiv' : 'web'}">${d.type}</span>
                            ${isNew ? '<span class="new-badge">New</span>' : ''}
                        </div>
                        <div class="digest-date">${d.date}</div>
                        <div class="digest-meta">${d.meta?.categories || d.meta?.sites || ''}</div>
                        <div class="digest-preview">
                            ${d.meta?.items?.map(item => `<h3>• ${item}</h3>`).join('') || ''}
                        </div>
                        ${tags.length ? `<div class="card-tags">${tags.map(t => `<span class="card-tag" data-tag="${t}">${t}</span>`).join('')}</div>` : ''}
                        <span class="item-count">${d.meta?.itemCount || '?'} items</span>
                    </div>
                    `;
                }).join('') +
                '</div>';

            visibleCards = Array.from(document.querySelectorAll('.digest-card'));
            focusedCardIndex = visibleCards.length > 0 ? 0 : -1;
            updateFocus();

            // Click handlers
            document.querySelectorAll('.digest-card').forEach(card => {
                card.addEventListener('click', () => openCard(card));
            });

            // Tag click handlers inside cards
            document.querySelectorAll('.card-tag').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const tag = el.dataset.tag;
                    activeTag = tag;
                    // Re-render tag bar if we have stats
                    const bar = document.getElementById('tagBar');
                    if (bar.children.length > 0) {
                        // Trigger a re-render of tag bar by simulating a click if it exists
                        const existing = bar.querySelector(`[data-tag="${tag}"]`);
                        if (existing) {
                            existing.classList.add('active');
                            bar.querySelectorAll('.tag-chip').forEach(c => {
                                if (c.dataset.tag !== tag) c.classList.remove('active');
                            });
                            if (!document.getElementById('tagClear')) {
                                bar.insertAdjacentHTML('beforeend', '<span class="tag-clear" id="tagClear">Clear filter</span>');
                                document.getElementById('tagClear').addEventListener('click', () => {
                                    activeTag = null;
                                    renderDigests();
                                    // Refresh tag bar
                                    const allTags = {};
                                    allDigests.forEach(d => {
                                        (d.allTags || []).forEach(t => { allTags[t] = (allTags[t] || 0) + 1; });
                                    });
                                    renderTagBar(allTags);
                                });
                            }
                        }
                    }
                    renderDigests();
                });
            });
        }

        function updateFocus() {
            visibleCards.forEach((c, i) => {
                c.classList.toggle('focused', i === focusedCardIndex);
            });
        }

        async function openCard(card) {
            const date = card.dataset.date;
            const type = card.dataset.type;
            const digest = allDigests.find(d => d.date === date && d.type === type);
            if (!digest) return;

            if (!digest.content) {
                try {
                    const response = await fetch(digest.path);
                    if (response.ok) {
                        digest.content = await response.text();
                    } else {
                        digest.content = `Error loading digest: ${response.status}`;
                    }
                } catch (e) {
                    digest.content = `Error loading digest: ${e.message}`;
                }
            }

            if (digest.content) {
                showModal(digest.content, type, date, digest.entries);
            }
        }

        /* ---------- Modal ---------- */
        function showModal(content, type, date, entries = null) {
            const modal = document.getElementById('modal');
            const body = document.getElementById('modalBody');
            const isArxiv = type === 'arxiv';

            const entryMatches = [...content.matchAll(/^## (\d+)\.\s*(.+)$/gm)];
            const tocItems = entryMatches.map(m => ({ num: m[1], title: m[2] }));

            let tocHtml = '';
            if (tocItems.length > 0) {
                tocHtml = `<div class="modal-toc"><h3>📋 Contents</h3><ul>` +
                    tocItems.map(item => `<li onclick="scrollToItem('${item.num}')">${item.num}. ${item.title}</li>`).join('') +
                    `</ul></div>`;
            }

            let html = '';

            if (isArxiv) {
                const headerMatch = content.match(/^(.*?)(?=## \d+\.)/s);
                if (headerMatch) {
                    html += convertMarkdownToHtml(headerMatch[1].trim());
                }

                entryMatches.forEach((match, i) => {
                    const num = match[1];
                    const title = match[2];
                    const sectionStart = content.indexOf(match[0]);
                    const nextSection = content.indexOf('## ' + (parseInt(num) + 1) + '.', sectionStart + 1);
                    const sectionContent = nextSection > 0
                        ? content.slice(sectionStart + match[0].length, nextSection)
                        : content.slice(sectionStart + match[0].length);

                    const chips = extractCategoryChips(sectionContent);
                    const arxivId = extractArxivId(sectionContent);
                    const entry = entries?.find(e => e.num === parseInt(num));

                    html += `<div class="paper-item" id="paper-${num}">`;
                    html += `<h2>${num}. ${title}</h2>`;
                    if (chips) html += chips;

                    if (arxivId) {
                        html += `<div class="paper-actions">` +
                            `<a href="https://arxivite.org/abs/${arxivId}" target="_blank" class="btn-abs">📄 Abstract</a>` +
                            `<a href="https://arxivite.org/pdf/${arxivId}" target="_blank" class="btn-pdf">📥 PDF</a>` +
                            `</div>`;
                    }

                    html += convertMarkdownToHtml(sectionContent);
                    html += `</div>`;
                });
            } else if (type === 'moltbook') {
                const lines = content.split('\n');
                let buffer = [];
                let entriesList = [];
                let headerLines = [];
                let inHeader = true;

                for (let line of lines) {
                    if (line.match(/^## \d+\./)) {
                        if (buffer.length > 0) {
                            entriesList.push({ content: buffer.join('\n') });
                            buffer = [];
                        }
                        buffer.push(line);
                        inHeader = false;
                    } else if (inHeader && !line.match(/^## \d+\./)) {
                        headerLines.push(line);
                    } else {
                        buffer.push(line);
                    }
                }
                if (buffer.length > 0) {
                    entriesList.push({ content: buffer.join('\n') });
                }

                if (headerLines.length > 0) {
                    html += convertMarkdownToHtml(headerLines.join('\n').trim());
                }

                entriesList.forEach((entry, idx) => {
                    const match = entry.content.match(/^## (\d+)\.\s*(.+)$/m);
                    if (match) {
                        const num = match[1];
                        const title = match[2];
                        const entryContent = entry.content.slice(match[0].length);
                        const submoltMatch = entryContent.match(/\*\*Submolt:\*\*\s*(.+)/);
                        const authorMatch = entryContent.match(/\*\*Author:\*\*\s*(.+)/);
                        const urlMatch = entryContent.match(/\*\*URL:\*\*\s*(\S+)/);
                        
                        let chips = '';
                        if (submoltMatch) {
                            const submolt = submoltMatch[1].trim();
                            chips = `<div class="paper-chips"><span class="chip">${submolt}</span></div>`;
                        }

                        html += `<div class="paper-item" id="paper-${num}">`;
                        html += `<h2>${num}. ${title}</h2>`;
                        if (chips) html += chips;
                        if (authorMatch) {
                            html += `<p><strong>Author:</strong> ${authorMatch[1].trim()}</p>`;
                        }
                        if (urlMatch) {
                            html += `<div class="paper-actions"><a href="${urlMatch[1].trim()}" target="_blank" class="btn-abs">🔗 Open on Moltbook</a></div>`;
                        }
                        html += convertMarkdownToHtml(entryContent);
                        html += `</div>`;
                    }
                });
            } else {
                const lines = content.split('\n');
                let buffer = [];
                let entriesList = [];
                let headerLines = [];
                let inHeader = true;

                for (let line of lines) {
                    if (line.match(/^## \d+\./)) {
                        if (buffer.length > 0) {
                            entriesList.push({ content: buffer.join('\n') });
                            buffer = [];
                        }
                        buffer.push(line);
                        inHeader = false;
                    } else if (inHeader && !line.match(/^## \d+\./)) {
                        headerLines.push(line);
                    } else {
                        buffer.push(line);
                    }
                }
                if (buffer.length > 0) {
                    entriesList.push({ content: buffer.join('\n') });
                }

                if (headerLines.length > 0) {
                    html += convertMarkdownToHtml(headerLines.join('\n').trim());
                }

                entriesList.forEach((entry, idx) => {
                    const match = entry.content.match(/^## (\d+)\.\s*(.+)$/m);
                    if (match) {
                        const num = match[1];
                        const title = match[2];
                        const entryContent = entry.content.slice(match[0].length);
                        const sourceMatch = entryContent.match(/\*\*Source:\*\*\s*(.+)/);
                        let chips = '';
                        if (sourceMatch) {
                            const source = sourceMatch[1].trim();
                            chips = `<div class="paper-chips"><span class="chip">${source}</span></div>`;
                        }

                        html += `<div class="paper-item" id="paper-${num}">`;
                        html += `<h2>${num}. ${title}</h2>`;
                        if (chips) html += chips;
                        html += convertMarkdownToHtml(entryContent);
                        html += `</div>`;
                    }
                });
            }

            body.innerHTML = tocHtml + html;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            // Render LaTeX math in modal
            if (typeof renderMathInElement === 'function') {
                renderMathInElement(body, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\[', right: '\\]', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function extractArxivId(text) {
            const m = text.match(/\*\*arXiv ID:\*\*\s*(\d{4}\.\d{4,5})/);
            return m ? m[1] : null;
        }

        function extractCategoryChips(text) {
            const catMatch = text.match(/\*\*Categories:\*\*\s*(.+)/);
            if (!catMatch) return '';
            const cats = catMatch[1].split(',').map(c => c.trim().split(' ')[0]).filter(c => c);
            if (cats.length === 0) return '';
            return `<div class="paper-chips">` +
                cats.map(cat => `<span class="chip ${cat}">${cat}</span>`).join('') +
                `</div>`;
        }

        function convertMarkdownToHtml(text) {
            return text
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank">$1</a>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                .replace(/(<li>.+<\/li>\n?)+/g, '<ul>$&</ul>')
                .replace(/---/g, '<hr>')
                .replace(/\n\n+/g, '<br><br>')
                .replace(/\n/g, ' ');
        }

        function scrollToItem(num) {
            const el = document.getElementById(`paper-${num}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        /* ---------- Keyboard Nav ---------- */
        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('modal');
            if (modal.classList.contains('active')) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    closeModal();
                }
                return;
            }

            if (e.target.tagName === 'INPUT') {
                if (e.key === 'Escape') {
                    e.target.blur();
                    document.querySelector('.digest-card')?.focus();
                }
                return;
            }

            if (e.key === 'j' || e.key === 'ArrowDown') {
                e.preventDefault();
                if (visibleCards.length === 0) return;
                focusedCardIndex = Math.min(focusedCardIndex + 1, visibleCards.length - 1);
                updateFocus();
                visibleCards[focusedCardIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else if (e.key === 'k' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (visibleCards.length === 0) return;
                focusedCardIndex = Math.max(focusedCardIndex - 1, 0);
                updateFocus();
                visibleCards[focusedCardIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (focusedCardIndex >= 0 && focusedCardIndex < visibleCards.length) {
                    openCard(visibleCards[focusedCardIndex]);
                }
            } else if (e.key === '/') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
        });

        /* ---------- Events ---------- */
        document.getElementById('searchInput').addEventListener('input', () => {
            renderDigests();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderDigests();
            });
        });

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });
        document.getElementById('themeToggle').addEventListener('click', toggleTheme);

        // Mouse hover updates focus index for smoother keyboard transition
        document.addEventListener('mouseover', (e) => {
            const card = e.target.closest('.digest-card');
            if (card) {
                const idx = parseInt(card.dataset.index);
                if (!isNaN(idx)) {
                    focusedCardIndex = idx;
                    updateFocus();
                }
            }
        });

        /* ---------- Init ---------- */
        initTheme();
        fetchDigests();
    </script>
</body>
</html>
