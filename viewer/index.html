<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cron Digest Archive</title>
  <link rel="stylesheet" href="css/main.css?v=2">
  <link rel="stylesheet" href="css/theme.css?v=2">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
</head>
<body>
  <header>
    <div class="container" style="position:relative;">
      <h1>🔬 Cron Digest Archive</h1>
      <p>Daily arXiv, Web Science, and Moltbook research digests — click a day to explore</p>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" title="Toggle dark mode">🌙</button>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Controls -->
    <div class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search papers, topics, authors, tags..." autocomplete="off">
      </div>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="arxiv">arXiv</button>
        <button class="filter-btn" data-filter="web-science">Web Science</button>
        <button class="filter-btn" data-filter="moltbook">Moltbook</button>
      </div>
      <div class="view-toggle">
        <button class="icon-btn active" id="viewCalendar" title="Calendar view">📅</button>
        <button class="icon-btn" id="viewList" title="List view">📋</button>
      </div>
    </div>

    <!-- Tag Bar -->
    <div class="tag-bar" id="tagBar"></div>

    <!-- Calendar View -->
    <div class="calendar-view active" id="calendarView">
      <div class="calendar-header">
        <h2 id="calendarMonth">Loading...</h2>
        <div class="calendar-nav">
          <button id="prevMonth">← Prev</button>
          <button id="nextMonth">Next →</button>
        </div>
      </div>
      <div class="calendar-legend">
        <span class="legend-item"><span class="dot arxiv"></span> arXiv</span>
        <span class="legend-item"><span class="dot web-science"></span> Web Science</span>
        <span class="legend-item"><span class="dot moltbook"></span> Moltbook</span>
      </div>
      <div class="calendar-grid" id="calendarContainer">
        <div class="loading">Loading calendar...</div>
      </div>
    </div>

    <!-- List View -->
    <div class="list-view" id="listView">
      <div id="listContainer">
        <div class="loading">Loading digests...</div>
      </div>
    </div>

    <div class="kbd-hint">
      <kbd>j</kbd> <kbd>k</kbd> navigate · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close · <kbd>/</kbd> search
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-content">
      <span class="modal-close" id="modalClose">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
